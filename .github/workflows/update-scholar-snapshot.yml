name: Update Scholar snapshot

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm update:scholar
      - name: Commit changed Scholar data
        run: |
          if git diff --quiet -- assets/scholar-citations.png assets/scholar-stats.json; then
            echo "Scholar data is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/scholar-citations.png assets/scholar-stats.json
          git commit -m "chore: refresh Scholar citation data"
          git push
